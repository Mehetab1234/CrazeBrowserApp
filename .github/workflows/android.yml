name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Android SDK
      uses: reactivecircus/android-sdk@v2  # or the appropriate available version
      with:
        api-level: 30
        build-tools: 30.0.3

    - name: Install dependencies
      run: |
        sudo apt-get install openjdk-11-jdk gradle unzip
        gradle --version

    - name: Build APK
      run: |
        cd CrazeBrowserApp
        ./gradlew clean
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: CrazeBrowser-APK
        path: CrazeBrowserApp/app/build/outputs/apk/debug/app-debug.apk
